name: Build AMI GameDay APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out project
        uses: actions/checkout@v4
      - name: Unpack the one-file upload (if used)
        shell: bash
        run: |
          if [ ! -f source/app/build.gradle ]; then
            if [ ! -f AMI-GameDay-Source.zip ]; then
              echo 'Missing source/ folder and AMI-GameDay-Source.zip' >&2
              exit 1
            fi
            unzip -qo AMI-GameDay-Source.zip
          fi
          test -f source/app/build.gradle
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android API 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Install Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build installable debug APK
        working-directory: source
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Publish APK
        uses: actions/upload-artifact@v4
        with:
          name: AMI-GameDay-Android-APK
          path: source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
