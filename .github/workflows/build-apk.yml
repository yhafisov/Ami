name: Build AMI GameDay APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Find and unpack Android source
        shell: bash
        run: |
          set -euo pipefail
          if [ -f source/app/build.gradle ]; then
            echo 'Android source folder found.'
            exit 0
          fi
          for archive in AMI-GameDay-Source.zip AMI-GameDay-GitHub-Ready.zip; do
            if [ -f "$archive" ]; then
              echo "Unpacking $archive"
              unzip -qo "$archive"
              if [ -f source/app/build.gradle ]; then
                exit 0
              fi
            fi
          done
          while IFS= read -r -d '' archive; do
            echo "Checking $archive"
            if unzip -Z -1 "$archive" | grep -E '^source/app/build\.gradle$' >/dev/null; then
              unzip -qo "$archive"
              if [ -f source/app/build.gradle ]; then
                exit 0
              fi
            fi
          done < <(find . -maxdepth 2 -type f -iname '*.zip' -print0)
          echo 'ERROR: Upload AMI-GameDay-Source.zip in the repository root.' >&2
          exit 1

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub's Ubuntu runners already include the Android command-line tools.
      # Do NOT use the obsolete Android SDK package named "tools".
      - name: Install Android SDK API 35 and build tools
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMGR="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMGR" ]]; then
            SDKMGR="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' 2>/dev/null | sort -V | tail -1)"
          fi
          if [[ ! -x "$SDKMGR" ]]; then
            echo "ERROR: Android sdkmanager not found under $SDK_ROOT" >&2
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          # 'yes' returns 141 when sdkmanager closes the pipe; this is harmless.
          set +o pipefail
          yes | "$SDKMGR" --sdk_root="$SDK_ROOT" --licenses >/dev/null
          set -o pipefail
          "$SDKMGR" --sdk_root="$SDK_ROOT" --install \
            'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Install Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build installable debug APK
        working-directory: source
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Publish APK
        uses: actions/upload-artifact@v4
        with:
          name: AMI-GameDay-Android-APK
          path: source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
          
